[package]
name = "opensheet-core"
version = "0.1.0"
edition = "2021"
description = "OpenSheet grid engine: cell storage, dependency graph and recalculation, exported to WebAssembly."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
